<VirtualHost *:80>
    DocumentRoot "/var/www/ip-management-backend/public/"
    ServerName location-marketing

    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php:9000/var/www/ip-management-backend/public/$1

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
    RemoteIPHeader X-Forwarded-For

    <Directory "/var/www/ip-management-backend/">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>